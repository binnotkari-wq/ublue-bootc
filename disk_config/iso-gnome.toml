[customizations.installer.kickstart]
contents = """
# Configuration de la localisation pour l'installateur
lang fr_FR.UTF-8
keyboard fr
timezone Europe/Paris

# Interface graphique
graphical

%post
bootc switch --mutate-in-place --transport registry ghcr.io/binnotkari-wq/ublue-bootc:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Network",
]
disable = [
  # On le laisse désactivé car la politique de sécurité est prédéfinie dans l'image elle-même
  "org.fedoraproject.Anaconda.Modules.Security",
  # On le laisse désactivé car les service sont configurés dans l'image elle-même
  "org.fedoraproject.Anaconda.Modules.Services",
  # On le laisse désactivé car aucun service d'abonnement n'est utilisé dans Fedora
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
